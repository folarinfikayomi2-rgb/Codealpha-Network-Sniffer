

name: Network Sniffer CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Python Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install scapy pytest ruff bandit

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Check code quality
        run: python -m ruff check . --exit-zero

      - name: Run tests if present
        run: |
          if find . -type f -name 'test_*.py' \
            -not -path './.git/*' | grep -q .; then
            python -m pytest -v
          else
            echo "No pytest test files found yet; skipping tests."
          fi
